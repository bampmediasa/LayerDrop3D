<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-/eCWsUHEtFM7kBdNkx3rDFi19aev6aTEX5aE3W+5890='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Your Order // LayerDrop3D</title>
<meta name="description" content="View, pay, and track your LayerDrop3D order." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03060a; --bg-2: #070c14; --panel: rgba(10, 18, 30, 0.72);
    --border: rgba(0, 168, 255, 0.18); --border-strong: rgba(0, 168, 255, 0.45);
    --cyan: #00A8FF; --cyan-2: #00e5ff; --mag: #ff2bd6; --lime: #b4ff39;
    --text: #d9e6f2; --text-dim: #7b8ea3; --red: #ff4d6a;
    --glow: 0 0 24px rgba(0, 168, 255, 0.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; background:
      radial-gradient(1200px 600px at 80% -10%, rgba(0,168,255,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(255,43,214,0.06), transparent 60%), var(--bg); }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
      background-image: linear-gradient(rgba(0,168,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,168,255,0.05) 1px, transparent 1px);
      background-size: 48px 48px; mask-image: linear-gradient(to bottom, black, transparent 70%); -webkit-mask-image: linear-gradient(to bottom, black, transparent 70%); }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.02em; }
  header { position: sticky; top:0; z-index: 5; backdrop-filter: blur(12px); background: rgba(3,6,10,0.75); border-bottom: 1px solid var(--border); }
  .nav { max-width: 980px; margin: 0 auto; padding: 16px 20px; display:flex; align-items:center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: -0.02em; font-size: 20px; }
  .brand-mark { width: 34px; height: 34px; }
  .brand-mark svg { width:100%; height:100%; filter: drop-shadow(0 0 8px rgba(0,168,255,0.6)); }
  .brand b { color: #fff; } .brand .sep { color: var(--cyan); }
  .nav-cta { padding: 9px 14px; border: 1px solid var(--border-strong); color: var(--cyan); font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; background: rgba(0,168,255,0.06); transition: all .2s; }
  .nav-cta:hover { background: var(--cyan); color: #000; box-shadow: var(--glow); }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; position: relative; }
  .kicker { font-family:'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -0.03em; color:#fff; margin: 8px 0 6px; line-height: 1.05; }
  .sub { color: var(--text-dim); font-size: 15px; }
  .panel { background: var(--panel); border: 1px solid var(--border); padding: 22px; position: relative; }
  .panel::before { content:""; position:absolute; top:-1px; left:-1px; width:14px; height:14px; border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
  .panel::after { content:""; position:absolute; bottom:-1px; right:-1px; width:14px; height:14px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }
  .grid { display:grid; grid-template-columns: 1.35fr 1fr; gap: 18px; margin-top: 22px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .grid .side { order: -1; } }
  .stack > * + * { margin-top: 18px; }
  .row { display:flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .badge { display:inline-flex; align-items:center; gap:8px; padding: 6px 10px; font-family:'JetBrains Mono', monospace; font-size: 11px; font-weight:700; letter-spacing:.12em; text-transform: uppercase; border: 1px solid var(--border-strong); color: var(--cyan); }
  .badge .dot { width:7px; height:7px; border-radius:50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
  .badge.paid { color: var(--lime); border-color: rgba(180,255,57,.45); }
  .badge.overdue, .badge.void { color: var(--red); border-color: rgba(255,77,106,.5); }
  .amount { font-size: clamp(34px, 6vw, 52px); font-weight: 700; color:#fff; letter-spacing:-0.03em; }
  .label { font-family:'JetBrains Mono', monospace; font-size: 11px; letter-spacing:.16em; text-transform: uppercase; color: var(--text-dim); }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding: 15px 18px; font-family:'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; border: 1px solid var(--cyan); background: var(--cyan); color:#000; cursor:pointer; transition: all .2s; }
  .btn:hover { box-shadow: var(--glow); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--cyan); }
  .btn.ghost:hover { background: rgba(0,168,255,.1); }
  .btn small { font-weight: 500; opacity: .75; letter-spacing: .02em; text-transform: none; }
  .pay-list > * + * { margin-top: 10px; }
  .hint { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .hint b { color: var(--text); }
  table { width:100%; border-collapse: collapse; font-size: 14px; }
  th { text-align:left; font-family:'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--text-dim); font-weight:500; padding: 0 0 10px; border-bottom:1px solid var(--border); }
  td { padding: 12px 0; border-bottom: 1px solid rgba(0,168,255,.08); vertical-align: top; }
  td.r, th.r { text-align:right; white-space: nowrap; padding-left: 12px; }
  td .d { color: var(--text-dim); font-size: 12.5px; margin-top: 3px; }
  .totals { margin-top: 12px; font-size: 14px; }
  .totals .row { padding: 4px 0; color: var(--text-dim); }
  .totals .row.big { color:#fff; font-weight:700; font-size: 18px; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--border); }
  /* progress */
  .steps { display:flex; gap: 0; margin: 6px 0 2px; }
  .step { flex:1; position: relative; text-align:center; padding-top: 40px; font-size: 12px; color: var(--text-dim); }
  .step::before { content:""; position:absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; border: 2px solid rgba(123,142,163,.5); background: var(--bg); z-index:1; transform: translateX(-50%) rotate(45deg); }
  .step::after { content:""; position:absolute; top: 17px; left: -50%; width: 100%; height: 2px; background: rgba(123,142,163,.25); }
  .step:first-child::after { display:none; }
  .step.done { color: var(--text); }
  .step.done::before { background: var(--cyan); border-color: var(--cyan); box-shadow: var(--glow); }
  .step.done::after { background: var(--cyan); }
  .step.now { color:#fff; font-weight:600; }
  .step.now::before { border-color: var(--cyan); background: var(--bg); box-shadow: 0 0 0 4px rgba(0,168,255,.2); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(0,168,255,.05); } }
  .ship { border: 1px solid var(--border); padding: 14px; margin-top: 12px; }
  .ship .trk { font-family:'JetBrains Mono', monospace; font-size: 13px; color:#fff; word-break: break-all; }
  .events { margin-top: 10px; border-left: 1px solid var(--border-strong); padding-left: 14px; }
  .events div { font-size: 13px; padding: 4px 0; color: var(--text-dim); }
  .events div b { color: var(--text); font-weight: 500; }
  .tl div { display:flex; gap: 12px; font-size: 13.5px; padding: 7px 0; border-bottom: 1px dashed rgba(0,168,255,.1); }
  .tl .when { font-family:'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-dim); min-width: 108px; padding-top: 2px; }
  .addr { font-size: 14px; line-height: 1.55; }
  .limited { font-size: 12.5px; color: var(--text-dim); border: 1px dashed var(--border); padding: 10px 12px; margin-top: 14px; }
  .notes { white-space: pre-wrap; font-size: 14px; line-height: 1.55; border-left: 2px solid var(--cyan); padding-left: 12px; color: var(--text); }
  .center { text-align:center; }
  .loading { padding: 80px 0; text-align:center; color: var(--text-dim); font-family:'JetBrains Mono', monospace; letter-spacing:.1em; }
  form.lookup { max-width: 460px; margin: 26px auto 0; }
  form.lookup label { display:block; margin: 16px 0 6px; }
  input { width:100%; padding: 14px; background: rgba(0,0,0,.35); border: 1px solid var(--border-strong); color:#fff; font: 15px 'Space Grotesk', sans-serif; outline: none; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,168,255,.15); }
  .err { color: var(--red); font-size: 14px; margin-top: 12px; min-height: 20px; }
  .paid-box { text-align:center; padding: 10px 0 4px; }
  .paid-box .check { width: 54px; height: 54px; margin: 0 auto 10px; border: 2px solid var(--lime); display:grid; place-items:center; transform: rotate(45deg); box-shadow: 0 0 22px rgba(180,255,57,.35); }
  .paid-box .check span { transform: rotate(-45deg); color: var(--lime); font-size: 24px; font-weight: 700; }
  footer { border-top: 1px solid var(--border); padding: 22px 20px; color: var(--text-dim); font-size: 12px; }
  footer .in { max-width: 980px; margin: 0 auto; display:flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .actions { display:flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .actions a, .actions button { flex: 1; min-width: 140px; }
  @media print {
    body { background: #fff !important; color: #000; } body::before, header nav, .noprint, footer { display:none !important; }
    header { position: static; background: #fff; border: 0; } .brand b, h1, .amount { color:#000 !important; }
    .panel { background:#fff; border: 1px solid #ccc; } .grid { grid-template-columns: 1fr; } td, th { color:#000; }
  }
</style>
</head>
<body>
<header>
  <div class="nav">
    <a href="/" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="72" width="60" height="4" fill="#00A8FF" opacity="0.4" rx="1"/>
          <rect x="18" y="64" width="64" height="6" fill="none" stroke="#00A8FF" stroke-width="2.2" opacity="0.95" rx="2"/>
          <rect x="22" y="54" width="56" height="6" fill="none" stroke="#00A8FF" stroke-width="2.2" opacity="0.75" rx="2"/>
          <rect x="28" y="44" width="44" height="6" fill="none" stroke="#00A8FF" stroke-width="2.2" opacity="0.6" rx="2"/>
          <rect x="34" y="34" width="32" height="6" fill="none" stroke="#00A8FF" stroke-width="2.2" opacity="0.5" rx="2"/>
          <rect x="40" y="24" width="20" height="6" fill="none" stroke="#00A8FF" stroke-width="2.2" opacity="0.4" rx="2"/>
          <circle cx="50" cy="20" r="3" fill="#00A8FF" opacity="0.9"/>
          <line x1="50" y1="17" x2="50" y2="12" stroke="#00A8FF" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
        </svg>
      </span>
      <span><b>Layer</b><span class="sep">Drop</span><b>3D</b></span>
    </a>
    <a href="/invoice/" class="nav-cta noprint" id="findLink">Find my order</a>
  </div>
</header>

<main id="app"><div class="loading">// LOADING ORDER…</div></main>

<footer class="noprint"><div class="in mono">
  <span>© <span id="yr"></span> LAYERDROP3D</span>
  <span>Questions? <a id="footMail" href="mailto:bampmediasa@gmail.com" style="color:var(--cyan)">bampmediasa@gmail.com</a></span>
  <span><a href="/">LAYERDROP3D.COM</a></span>
</div></footer>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  document.getElementById("yr").textContent = new Date().getFullYear();
  var enc = new TextEncoder();

  // ---------- crypto (mirror of publish.py) ----------
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
  function b64(s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function b64u(bytes) { var s = ""; bytes = new Uint8Array(bytes); for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function hmacKey(raw) { return crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]); }
  function concat(a, b) { var o = new Uint8Array(a.length + b.length); o.set(a, 0); o.set(b, a.length); return o; }
  async function sign(k, data) { return new Uint8Array(await crypto.subtle.sign("HMAC", k, data)); }
  async function fileId(key) { return hex(await crypto.subtle.digest("SHA-256", enc.encode("ld3d-id|" + key))).slice(0, 32); }
  async function decrypt(key, blob) {
    var base = await hmacKey(enc.encode(key));
    var encK = await hmacKey(await sign(base, enc.encode("enc")));
    var macK = await hmacKey(await sign(base, enc.encode("mac")));
    var n = b64(blob.n), c = b64(blob.c), t = b64(blob.t);
    var tag = await sign(macK, concat(n, c));
    if (tag.length !== t.length) throw new Error("tag");
    var diff = 0; for (var i = 0; i < tag.length; i++) diff |= tag[i] ^ t[i];
    if (diff) throw new Error("tag");
    var out = new Uint8Array(c.length);
    for (var blk = 0; blk * 32 < c.length; blk++) {
      var ctr = new Uint8Array(4); new DataView(ctr.buffer).setUint32(0, blk);
      var ks = await sign(encK, concat(n, ctr));
      for (var j = 0; j < 32 && blk * 32 + j < c.length; j++) out[blk * 32 + j] = c[blk * 32 + j] ^ ks[j];
    }
    return JSON.parse(new TextDecoder().decode(out));
  }
  async function trackKey(email, number) {
    var k = await crypto.subtle.importKey("raw", enc.encode(email.trim().toLowerCase()), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode("ld3d-track|" + number.trim().toUpperCase()), iterations: 150000 }, k, 256);
    return b64u(bits);
  }

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function money(c) { c = c || 0; return (c < 0 ? "-" : "") + "$" + (Math.abs(c) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function day(s) { if (!s) return ""; var d = typeof s === "number" ? new Date(s * 1000) : new Date(String(s).slice(0, 10) + "T12:00:00"); return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
  function when(ts) { var d = new Date(typeof ts === "number" ? ts * 1000 : ts); return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
  function safeUrl(u) { return /^https:\/\//i.test(u || "") ? u : "#"; }

  async function load(key, fromLookup) {
    var id = await fileId(key);
    var r = await fetch("/invoice/d/" + id + ".json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(fromLookup ? "notfound" : "missing");
    return decrypt(key, await r.json());
  }

  function lookupForm(msg) {
    document.title = "Find your order // LayerDrop3D";
    document.getElementById("findLink").style.display = "none";
    app.innerHTML =
      '<div class="center" style="padding-top:30px"><div class="kicker">// Order lookup</div><h1>Pay or track your order</h1>' +
      '<p class="sub">Use the invoice number from your email (like LD-1001) and the email address it was sent to.</p></div>' +
      '<form class="lookup panel" id="lf"><label class="label" for="num">Invoice number</label><input id="num" autocomplete="off" placeholder="LD-1001" required>' +
      '<label class="label" for="em">Email address</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com" required>' +
      '<div style="margin-top:20px"><button class="btn" type="submit" id="go">Find my order →</button></div><div class="err" id="err">' + esc(msg || "") + '</div>' +
      '<p class="hint" style="margin-top:6px">Just placed an order? It can take a few minutes to appear here.</p></form>';
    document.getElementById("lf").addEventListener("submit", async function (e) {
      e.preventDefault();
      var btn = document.getElementById("go"), err = document.getElementById("err");
      btn.disabled = true; btn.textContent = "Searching…"; err.textContent = "";
      try {
        var num = document.getElementById("num").value.trim().toUpperCase().replace(/\s+/g, "");
        if (/^\d+$/.test(num)) num = "LD-" + num;
        num = num.replace(/^LD(\d)/, "LD-$1");
        var key = await trackKey(document.getElementById("em").value, num);
        var data = await load(key, true);
        location.hash = key;
        render(data, key);
      } catch (x) {
        err.textContent = "We couldn't find that order. Double-check the invoice number and email, or email us.";
        btn.disabled = false; btn.textContent = "Find my order →";
      }
    });
  }

  function steps(d) {
    var pickup = d.fulfillment === "pickup";
    var list = [["sent", "Invoice"], ["paid", "Paid"], ["printing", "Printing"]]
      .concat(pickup ? [["ready", "Ready"], ["picked_up", "Picked up"]] : [["shipped", "Shipped"], ["delivered", "Delivered"]]);
    if (d.status === "partial") list[1][1] = "Deposit paid";
    var order = ["new", "printing", "ready", "shipped", "delivered", "picked_up"];
    var si = order.indexOf(d.stage);
    var paid = d.status === "paid";
    var done = function (k) {
      if (k === "sent") return true;
      if (k === "paid") return paid || d.status === "partial";
      return si >= order.indexOf(k) && si > -1;
    };
    var firstUndone = -1;
    var html = list.map(function (s, i) {
      var isDone = done(s[0]);
      var cls = isDone ? "done" : "";
      if (!isDone && firstUndone < 0) { firstUndone = i; cls = "now"; }
      return '<div class="step ' + cls + '">' + esc(s[1]) + "</div>";
    }).join("");
    return '<div class="steps">' + html + "</div>";
  }

  function statusBadge(d) {
    if (d.status === "void") return '<span class="badge void"><span class="dot"></span>Cancelled</span>';
    if (d.status === "paid") return '<span class="badge paid"><span class="dot"></span>Paid</span>';
    if (d.overdue) return '<span class="badge overdue"><span class="dot"></span>Past due</span>';
    if (d.status === "partial") return '<span class="badge"><span class="dot"></span>Partially paid</span>';
    return '<span class="badge"><span class="dot"></span>Payment due</span>';
  }

  function payPanel(d) {
    if (d.status === "void") return '<div class="panel"><div class="label">Status</div><p style="margin-top:10px">This invoice was cancelled. Questions? Email <a style="color:var(--cyan)" href="mailto:' + esc(d.business.email) + '">' + esc(d.business.email) + "</a>.</p></div>";
    if (d.balance <= 0) {
      var lastPay = (d.payments || []).filter(function (p) { return !p.refund; }).slice(-1)[0];
      return '<div class="panel paid-box"><div class="check"><span>✓</span></div><div class="amount" style="font-size:30px">Paid in full</div>' +
        '<p class="hint" style="margin-top:6px">Thank you! ' + (lastPay ? "Received " + day(lastPay.ts) + " via " + esc(lastPay.method) + "." : "") +
        (d.refunded ? " " + money(d.refunded) + " was refunded to you." : "") + "</p></div>";
    }
    var p = d.pay || {}, b = "";
    if (p.stripe) b += '<a class="btn" href="' + esc(safeUrl(p.stripe)) + '" rel="noopener">Pay ' + money(d.balance) + ' by card <small>Apple Pay · Google Pay</small></a>';
    if (p.paypal) b += '<a class="btn ' + (p.stripe ? "ghost" : "") + '" href="' + esc(safeUrl(p.paypal)) + '" target="_blank" rel="noopener">Pay with PayPal</a>';
    if (p.venmo) b += '<a class="btn ghost" href="' + esc(safeUrl(p.venmo)) + '" target="_blank" rel="noopener">Pay with Venmo <small>' + esc(p.venmo_label || "") + "</small></a>";
    var extra = "";
    if (p.paypal_email) extra += "<p class='hint'>PayPal email: <b>" + esc(p.paypal_email) + "</b></p>";
    if (p.other) extra += "<p class='hint'>" + esc(p.other) + "</p>";
    return '<div class="panel"><div class="row"><div class="label">Balance due</div>' + (d.due_date ? '<div class="label">Due ' + esc(day(d.due_date)) + "</div>" : "") + "</div>" +
      '<div class="amount" style="margin:6px 0 16px">' + money(d.balance) + "</div>" +
      '<div class="pay-list">' + (b || '<p class="hint">Email us at <b>' + esc(d.business.email) + '</b> and we\'ll send payment options.</p>') + "</div>" +
      '<p class="hint" style="margin-top:14px">Please put <b>' + esc(d.number) + "</b> in the payment note so we can match it. " +
      "Payments usually show here within 15 minutes.</p>" + extra + "</div>";
  }

  function shipPanel(d) {
    if (d.fulfillment === "pickup") {
      if (d.stage === "ready") return '<div class="panel"><div class="label">Pickup</div><p style="margin-top:10px">Your order is ready for pickup in ' + esc(d.business.address || "Saratoga Springs, UT") + ". Reply to your invoice email to set a time.</p></div>";
      return "";
    }
    var s = d.shipments || [];
    var addr = d.ship_to && d.ship_to.street1 ? '<div class="addr">' + esc(d.ship_to.name) + "<br>" + esc(d.ship_to.street1) + (d.ship_to.street2 ? "<br>" + esc(d.ship_to.street2) : "") +
      "<br>" + esc(d.ship_to.city) + ", " + esc(d.ship_to.state) + " " + esc(d.ship_to.zip) + "</div>" : "";
    var body = s.length ? s.map(function (x) {
      var ev = (x.events || []).slice(0, 8).map(function (e) { return "<div><b>" + esc(e.msg || "") + "</b>" + (e.where ? " — " + esc(e.where) : "") + (e.ts ? "<br>" + esc(when(e.ts)) : "") + "</div>"; }).join("");
      var label = { pre_transit: "Label created", in_transit: "In transit", out_for_delivery: "Out for delivery", delivered: "Delivered", available_for_pickup: "Available for pickup", return_to_sender: "Returning to sender", failure: "Delivery issue" }[x.status] || "Shipped";
      return '<div class="ship"><div class="row"><span class="label">' + esc(x.carrier || "Carrier") + (x.service ? " · " + esc(x.service) : "") + "</span>" +
        '<span class="badge' + (x.status === "delivered" ? " paid" : "") + '"><span class="dot"></span>' + esc(label) + "</span></div>" +
        '<div class="trk" style="margin-top:8px">' + esc(x.tracking) + "</div>" +
        (x.eta && x.status !== "delivered" ? '<p class="hint" style="margin-top:4px">Estimated delivery: <b>' + esc(day(x.eta)) + "</b></p>" : "") +
        (x.url ? '<div style="margin-top:12px"><a class="btn ghost" href="' + esc(safeUrl(x.url)) + '" target="_blank" rel="noopener">Track package →</a></div>' : "") +
        (ev ? '<div class="events">' + ev + "</div>" : "") + "</div>";
    }).join("") : '<p class="hint" style="margin-top:10px">Tracking will appear here as soon as your order ships.</p>';
    return '<div class="panel"><div class="label">Shipping</div>' + (addr ? '<div style="margin-top:10px">' + addr + "</div>" : "") + body + "</div>";
  }

  function itemsPanel(d) {
    var rows = d.items.map(function (i) {
      var q = Number(i.qty);
      return "<tr><td>" + esc(i.description) + (i.details ? '<div class="d">' + esc(i.details) + "</div>" : "") + '</td><td class="r">' + (q % 1 ? q : q.toFixed(0)) +
        '</td><td class="r">' + money(i.amount) + "</td></tr>";
    }).join("");
    var t = '<div class="totals"><div class="row"><span>Subtotal</span><span>' + money(d.subtotal) + "</span></div>";
    if (d.discount) t += '<div class="row"><span>Discount</span><span>-' + money(d.discount) + "</span></div>";
    if (d.shipping) t += '<div class="row"><span>Shipping</span><span>' + money(d.shipping) + "</span></div>";
    if (d.tax) t += '<div class="row"><span>Sales tax</span><span>' + money(d.tax) + "</span></div>";
    t += '<div class="row big"><span>Total</span><span>' + money(d.total) + "</span></div>";
    (d.payments || []).forEach(function (p) {
      if (p.refund) t += '<div class="row"><span>Refunded ' + esc(day(p.ts)) + " · " + esc(p.method) + (p.note && p.note !== "Refund" ? " · " + esc(p.note) : "") + "</span><span>" + money(-p.amount) + "</span></div>";
      else t += '<div class="row"><span>Paid ' + esc(day(p.ts)) + " · " + esc(p.method) + "</span><span>-" + money(p.amount) + "</span></div>";
    });
    if (d.paid) t += '<div class="row big"><span>Balance</span><span>' + money(d.balance) + "</span></div>";
    t += "</div>";
    return '<div class="panel"><div class="row" style="margin-bottom:12px"><div class="label">Invoice ' + esc(d.number) + '</div><div class="label">Issued ' + esc(day(d.issue_date)) + "</div></div>" +
      '<table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>' + rows + "</tbody></table>" + t +
      (d.notes ? '<div style="margin-top:18px"><div class="label" style="margin-bottom:8px">Notes</div><div class="notes">' + esc(d.notes) + "</div></div>" : "") +
      '<div class="actions noprint"><button class="btn ghost" id="printBtn">Print / save PDF</button></div></div>';
  }

  function timelinePanel(d) {
    var tl = (d.timeline || []).slice().reverse();
    if (!tl.length) return "";
    return '<div class="panel"><div class="label" style="margin-bottom:8px">Order history</div><div class="tl">' +
      tl.map(function (e) { return '<div><span class="when">' + esc(when(e.ts)) + "</span><span>" + esc(e.text) + "</span></div>"; }).join("") + "</div></div>";
  }

  function render(d, key) {
    document.title = d.number + " // LayerDrop3D";
    if (d.business && d.business.email) { var fm = document.getElementById("footMail"); fm.textContent = d.business.email; fm.href = "mailto:" + d.business.email; }
    document.getElementById("findLink").style.display = "";
    var first = (d.customer.name || "").split(" ")[0];
    app.innerHTML =
      '<div class="row" style="flex-wrap:wrap;align-items:flex-end"><div><div class="kicker">// Order ' + esc(d.number) + "</div>" +
      "<h1>" + (first ? "Hi " + esc(first) + "." : "Your order") + "</h1>" +
      '<p class="sub">Here\'s everything about your LayerDrop3D order — payment, printing, and shipping.</p></div><div>' + statusBadge(d) + "</div></div>" +
      '<div class="panel" style="margin-top:22px">' + steps(d) + "</div>" +
      '<div class="grid"><div class="stack">' + itemsPanel(d) + timelinePanel(d) + '</div><div class="stack side">' +
      (d.balance <= 0 && (d.shipments || []).length ? shipPanel(d) + payPanel(d) : payPanel(d) + shipPanel(d)) + "</div></div>" +
      (d.limited ? '<p class="limited">You looked this order up by invoice number + email, so the shipping address and notes are hidden. The link in your invoice email shows everything.</p>' : "") +
      '<p class="hint center" style="margin-top:26px">Updated ' + esc(when(d.updated)) + ' · Bookmark this page to check back anytime.</p>';
    var pb = document.getElementById("printBtn"); if (pb) pb.addEventListener("click", function () { window.print(); });
  }

  async function start() {
    if (!window.crypto || !crypto.subtle) { app.innerHTML = '<div class="loading">This page needs a newer browser. Please email bampmediasa@gmail.com.</div>'; return; }
    var key = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (!key || key.length < 30) return lookupForm();
    try { render(await load(key), key); }
    catch (e) { lookupForm("This link didn't load — it may still be publishing (give it 2 minutes), or you can look it up below."); }
  }
  window.addEventListener("hashchange", function () { start(); });
  start();
})();
</script>
</body>
</html>
